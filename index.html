<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Codexについて楽しく学ぶためのシンプルな練習用Webサイトです。"
    />
    <title>Codex Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-pressed="false"
    >
      <span aria-hidden="true">🌙</span>
      <span class="theme-toggle-label">ダークモード</span>
    </button>

    <main class="card">
      <div class="icon" aria-hidden="true">&lt;/&gt;</div>
      <p class="eyebrow">WELCOME TO</p>
      <h1>Codex Practice</h1>
      <p class="description">
        Codexは、アイデアをコードに変えるお手伝いをするAIです。<br />
        コードの作成や修正、プログラミングの学習に活用できます。
      </p>

      <button id="action-button" type="button">クリックしてみる</button>
      <p id="message" class="message" role="status" aria-live="polite" hidden>
        Codexで作りました！
      </p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
